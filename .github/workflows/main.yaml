name: main
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Prevent later steps from reusing the checkout's git credentials
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # `go test` uses only a high-confidence subset of go vet, so execute also `go vet`
      - run: make vet

      - run: go fmt ./... && git diff --exit-code -- ':!go.sum'

      - run: make test

  release:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      # Required for GoReleaser to create the draft release.
      contents: write
      # Required for artifact attestations
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This is required for GoReleaser to work properly
          # cf. https://goreleaser.com/customization/ci/actions/
          fetch-depth: 0
          # Prevent later steps from reusing the checkout's git credentials
          persist-credentials: false

      - name: Check the version
        run: grep -qr "version = \"$(git tag --points-at HEAD | sed 's/^v//')\"" cmd

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Prevent cache poisoning
          cache: false

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.1
          # Keep the release mutable until every publishing step succeeds.
          args: release --clean --draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Use a custom token instead of GITHUB_TOKEN for the homebrew tap
          # cf. https://www.goreleaser.com/resources/errors/resource-not-accessible-by-integration/
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Publish the release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
